<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - BoardFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; border-radius: 1rem; border: 1px solid #334155; background-color: #1e293b; }
    </style>
</head>
<body>
    <div class="login-card p-4 p-sm-5 text-light shadow-lg">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 bg-primary rounded-circle mb-3">
                <i class="bi bi-shield-lock-fill text-white fs-3"></i>
            </div>
            <h3 class="fw-bold">BoardFlow Staff Portal</h3>
            <p class="text-secondary small">Sign in to manage client onboarding workflows</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small" role="alert">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label small fw-semibold text-light">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" autofocus required id="id_username" class="form-control bg-dark text-light border-secondary" placeholder="Enter username">
                </div>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label small fw-semibold text-light">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" required id="id_password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign In
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-center text-secondary small">
            <span>Client Onboarding Automation System</span>
        </div>
    </div>
</body>
</html>
