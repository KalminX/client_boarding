{% extends "base.html" %}

{% block title %}Create Contract - BoardFlow{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">Draft New Client Contract</h2>
        <p class="text-secondary mb-0">Prepare a master services contract for e-signature.</p>
    </div>
    <a href="{% url 'contract_list' %}" class="btn btn-outline-secondary">
        &larr; Back to Contracts
    </a>
</div>

<div class="card col-md-8 mx-auto p-4 shadow-sm">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Select Client *</label>
            <select name="client_id" class="form-select" required>
                <option value="">-- Choose Client --</option>
                {% for client in clients %}
                    <option value="{{ client.id }}">{{ client.company_name }} ({{ client.name }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Contract Title *</label>
                <input type="text" name="title" value="Master Services Agreement 2026" class="form-control" required>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Contract Value (USD) *</label>
                <input type="number" step="0.01" name="contract_value" value="25000.00" class="form-control" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Terms & Scope Summary</label>
            <textarea name="terms_summary" rows="4" class="form-control" placeholder="Define deliverables, payment milestones, SLA, and onboarding expectations...">Scope includes enterprise onboarding, custom system integration, staff training, and 12-month tier 1 support.</textarea>
        </div>

        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
            <i class="bi bi-file-earmark-plus me-1"></i> Create Contract & Ready for Signature
        </button>
    </form>
</div>
{% endblock %}
